<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гаражная веломастерская | Yeti Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Yeti SB160 & Pleasant Orange Palette */
            --bg-main: #FFF4E6; /* Мягкий, приятный светлый оранжевый (персиковый) */
            --bg-card: #FFFFFF; /* Белые карточки для чистоты */
            --bg-dark: #1A1A1A; /* Темный для контрастных блоков (Maxxis) */
            
            --yeti-turf: #00A896; /* Фирменный бирюзовый Yeti */
            --yeti-turf-dark: #008B7D;
            
            --pleasant-orange: #E76F51; /* Приятный теплый оранжевый для кнопок */
            --pleasant-orange-hover: #D65A3B;
            
            --maxxis-orange: #FF5722; /* Яркий оранжевый Maxxis для акцентов */
            
            --text-dark: #1A1A1A;
            --text-muted: #555555;
            --text-light: #F4F4F4;
            
            --border-light: #FFE0C2;
            --shadow: 0 10px 30px rgba(231, 111, 81, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dark);
        }

        a { text-decoration: none; color: inherit; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* ===== HEADER ===== */
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(255, 244, 230, 0.95);
            backdrop-filter: blur(10px);
